    ctx.ellipse(Math.cos(t) * 6, Math.sin(t * 1.3) * 9, 17 - Math.abs(Math.sin(t)) * 7, 34, t * 0.5, 0, TAU);
    ctx.stroke();
  }
  ctx.restore();
}

function drawHero() {
  if (!hero) return;
  const bob = hero.moving ? Math.sin(hero.walkT) * 2.2 : Math.sin(time * 2.4) * 1.2;
  const flip = Math.cos(hero.aim) < 0;
  const elev = elevationAt(hero.x, hero.y);

  shadowBlob(hero.x, hero.y + 2 - elev, 24, 9, 0.55);

  ctx.save();
  if (hero.hurtT > 0) ctx.filter = 'brightness(2.2) saturate(0.4)';
  drawSprite('hero', hero.x, hero.y + bob - elev, 0.82, flip);
  ctx.filter = 'none';
  ctx.restore();

  const p = hero.swingT > 0 ? 1 - hero.swingT / hero.swingDur : 0;
  const ang = hero.swingT > 0 ? hero.swingAim - 1.2 + 2.4 * easeOut(p) : hero.aim;
  const handX = hero.x + Math.cos(hero.aim) * 9;
  const handY = hero.y - 34 + Math.sin(hero.aim) * 2 + bob - elev;

  if (hero.swingT > 0) {
    const a0 = hero.swingAim - 1.2;
    const a1 = hero.swingAim - 1.2 + 2.4 * easeOut(p);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath();
    ctx.arc(hero.x, hero.y - 30 - elev, 68, a0, a1);
    ctx.strokeStyle = 'rgba(170,210,255,' + (0.16 * (1 - p)).toFixed(3) + ')';
    ctx.lineWidth = 24;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.3 * (1 - p)).toFixed(3) + ')';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.restore();
  }

  const sw = assets.sword;
  if (sw) {
    ctx.save();
    ctx.translate(handX, handY);
    ctx.rotate(ang);
    ctx.drawImage(sw.img, -10, -11, 104 * 0.9, 24 * 0.9);
    ctx.restore();
  }
}

function drawMonster(m) {
  const a = assets[m.kind];
  const alpha = m.dead ? clamp(1 - m.deadT / 0.85, 0, 1) : 1;
  const sink = m.dead ? m.deadT * 10 : 0;
  const elev = elevationAt(m.x, m.y);
  const by = m.y - elev;

  if (m.isBoss && !m.dead) {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const pulse = 0.5 + 0.5 * Math.sin(time * 4);
    const gr = ctx.createRadialGradient(m.x, m.y - 50, 8, m.x, m.y - 50, 160);
    gr.addColorStop(0, 'rgba(255,70,25,' + (0.10 + 0.07 * pulse).toFixed(3) + ')');
    gr.addColorStop(0.6, 'rgba(255,40,10,' + (0.04 + 0.03 * pulse).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(255,20,0,0)');
    ctx.fillStyle = gr;
    ctx.beginPath();
    ctx.arc(m.x, m.y - 50, 160, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  shadowBlob(m.x, by + 1, (m.isBoss ? 40 : 20) * m.size, (m.isBoss ? 14 : 8) * m.size, 0.5 * alpha);

  if (m.windup > 0 && !m.dead) {
    const t = 1 - m.windup / m.windupMax;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = 'rgba(255,80,60,' + (0.18 + 0.3 * t).toFixed(3) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(m.x, by - 26 * m.size, 24 * m.size * (1.35 - t * 0.35), 0, TAU);
    ctx.stroke();
    ctx.restore();
  }

  ctx.save();
  if (m.hurtT > 0 && !m.dead) ctx.filter = 'brightness(2.6) saturate(0.3)';
  if (m.kind === 'imp') {
    const hop = m.moving ? Math.abs(Math.sin(m.animT * 9)) * -3 : 0;
    drawSprite(m.kind, m.x, by + hop + sink, m.size, m.facingLeft, alpha);
  } else {
    drawSprite(m.kind, m.x, by + sink + (m.lungeT > 0 ? 2 : 0), m.size, m.facingLeft, alpha);
  }
  ctx.filter = 'none';
  ctx.restore();

  if (!m.dead && m.isBoss) {
    if (m.bossPhase === 'rangeWind') {
      const prog = clamp(1 - m.phaseT / 1.2, 0, 1);
      const ox = m.x + Math.cos(m.attackAim) * (m.isSuper ? 28 : 22);
      const oy = m.y - 52 + Math.sin(m.attackAim) * 8;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const rr = (m.isSuper ? 14 : 10) + (m.isSuper ? 26 : 20) * prog;
      const og = ctx.createRadialGradient(ox, oy, 0, ox, oy, rr);
      og.addColorStop(0, 'rgba(255,255,225,1)');
      og.addColorStop(0.3, 'rgba(255,175,65,.9)');
      og.addColorStop(1, 'rgba(255,80,20,0)');
      ctx.fillStyle = og;
      ctx.beginPath();
      ctx.arc(ox, oy, rr, 0, TAU);
      ctx.fill();
      ctx.restore();
    }
    if (m.bossPhase === 'meleeWind') {
      const prog = clamp(1 - m.phaseT / m.meleeWind, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,90,40,' + (0.15 + 0.35 * prog).toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y - 58 * m.size, (m.isSuper ? 54 : 44) + 6 * Math.sin(time * 16), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
    if (m.bossPhase === 'rainCast') {
      const prog = clamp(1 - m.phaseT / 0.6, 0, 1);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255,120,50,' + (0.2 + 0.5 * prog).toFixed(3) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(m.x, m.y - 90 * m.size, 60 + 24 * Math.sin(time * 10), 0, TAU);
      ctx.stroke();
      ctx.restore();
    }
  }

  if (!m.dead && (m.hp < m.maxHp || m.aggro)) {
    const w = m.isBoss ? 84 : Math.max(28, 38 * m.size);
    const h = m.isBoss ? 8 : 5;
    const bx = m.x - w / 2;
    const by2 = by - (a ? a.h * m.size : 60) - 6;
    const pct = clamp(m.hp / m.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,.7)';
    ctx.fillRect(bx - 1, by2 - 1, w + 2, h + 2);
    ctx.fillStyle = '#3a0b10';
    ctx.fillRect(bx, by2, w, h);
    const grad = ctx.createLinearGradient(bx, by2, bx, by2 + h);
    grad.addColorStop(0, '#ff6b5c');
    grad.addColorStop(1, '#a7121f');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by2, w * pct, h);
    ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx + 0.5, by2 + 0.5, w - 1, h - 1);
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    const fire = p.type === 'fire' || p.type === 'bossfire';
    const col = fire ? '255,160,45' : '175,110,255';
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 26);
    g.addColorStop(0, 'rgba(255,255,235,.95)');
    g.addColorStop(0.3, 'rgba(' + col + ',.8)');
    g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 26, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = clamp(p.life / p.max, 0, 1);
    ctx.save();
    if (p.glow) ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawNumbers() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const n of numbers) {
    const a = clamp(n.life / n.max, 0, 1);
    const pop = 1 + (1 - a) * 0.25;
    ctx.globalAlpha = a;
    ctx.font = '700 ' + Math.round(17 * pop) + 'px "Segoe UI",Arial,sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.strokeText(n.text, n.x, n.y);
    ctx.fillStyle = n.color;
    ctx.fillText(n.text, n.x, n.y);
  }
  ctx.restore();
}

function drawMeteorWarnings() {
  for (const mt of meteors) {
    if (mt.state !== 'warn') continue;
    const p = clamp(1 - mt.t / mt.maxT, 0, 1);
    ctx.save();
    ctx.translate(mt.x, mt.y);
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, mt.r);
    g.addColorStop(0, 'rgba(255,120,40,' + (0.10 + 0.22 * p).toFixed(3) + ')');
    g.addColorStop(0.7, 'rgba(255,60,20,' + (0.08 + 0.18 * p).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,30,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(0, 0, mt.r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,150,80,' + (0.45 + 0.5 * p).toFixed(3) + ')';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([9, 7]);
    ctx.lineDashOffset = -time * 40;
    ctx.beginPath();
    ctx.arc(0, 0, mt.r, 0, TAU);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,220,160,' + (0.25 + 0.55 * p).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, mt.r * p, 0, TAU);
    ctx.stroke();
    const cg = ctx.createRadialGradient(0, 0, 0, 0, 0, 18 + 10 * p);
    cg.addColorStop(0, 'rgba(255,240,190,.9)');
    cg.addColorStop(0.4, 'rgba(255,140,40,.7)');
    cg.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(0, 0, 18 + 10 * p, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawMeteorBooms() {
  for (const mt of meteors) {
    if (mt.state !== 'boom') continue;
    const k = clamp(mt.life / 0.5, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const rr = mt.r * (1.3 - 0.3 * k);
    const g = ctx.createRadialGradient(mt.x, mt.y, 0, mt.x, mt.y, rr);
    g.addColorStop(0, 'rgba(255,245,205,' + (0.8 * k).toFixed(3) + ')');
    g.addColorStop(0.35, 'rgba(255,150,50,' + (0.6 * k).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,60,10,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mt.x, mt.y, rr, 0, TAU);
    ctx.fill();
    ctx.restore();
  }
}

function drawArenaGlow() {
  if (!map || !map.isArena) return;
  const gx = ((map.bossGateX0 + map.bossGateX1 + 1) / 2) * TILE;
  const gy = (map.bossGateY + 0.5) * TILE;
  const active = arena && arena.triggered && arena.phase !== 'fight' && arena.phase !== 'victory';
  const k = active ? 1 : 0.3;
  const fl = 0.7 + 0.3 * Math.sin(time * 5);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(gx, gy, 4, gx, gy, 190);
  g.addColorStop(0, 'rgba(255,80,30,' + (0.10 * k * fl).toFixed(3) + ')');
  g.addColorStop(0.5, 'rgba(255,40,15,' + (0.04 * k * fl).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(255,20,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(gx, gy, 190, 0, TAU);
  ctx.fill();
  ctx.restore();
}

function render() {
  ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
  ctx.fillStyle = '#07060a';
  ctx.fillRect(0, 0, view.w, view.h);
  if (!map) return;

  const sh = shake > 0.1 ? shake : 0;
  const ox = -cam.x + (Math.random() - 0.5) * sh;
  const oy = -cam.y + (Math.random() - 0.5) * sh;

  ctx.save();
  ctx.translate(ox, oy);

  drawFloor();
  drawTorches();
  drawBones();
  drawDecals();
  drawBossFx();
  drawArenaGlow();
  drawMeteorWarnings();
  drawPortal();

  // shadows + entities sorted by feet Y
  const ents = [];
  if (hero) ents.push({ y: hero.y, t: 0 });
  for (const m of monsters) ents.push({ y: m.y, t: 1, m });
  ents.sort((a, b) => a.y - b.y);
  for (const e of ents) {
    if (e.t === 0) drawHero();
    else drawMonster(e.m);
  }

  drawProjectiles();
  drawParticles();
  drawMeteorBooms();
  drawNumbers();

  ctx.restore();

  if (darkness > 0.01) {
    ctx.fillStyle = 'rgba(3,2,4,' + darkness.toFixed(3) + ')';
    ctx.fillRect(0, 0, view.w, view.h);
  }

  // красное свечение Диабло пробивает тьму
  const bossGlow = monsters.find(m => m.isBoss && !m.dead);
  if (bossGlow) {
    const bx = bossGlow.x - cam.x, by = bossGlow.y - cam.y - 60;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const g = ctx.createRadialGradient(bx, by, 10, bx, by, 250);
    g.addColorStop(0, 'rgba(255,70,25,' + (0.05 + darkness * 0.2).toFixed(3) + ')');
    g.addColorStop(0.6, 'rgba(255,40,10,' + (0.02 + darkness * 0.1).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(255,20,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.restore();
  }

  // screen-space lighting: warm light around hero + dark edges
  if (hero) {
    const hx = hero.x - cam.x, hy = hero.y - cam.y - 20;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const warm = ctx.createRadialGradient(hx, hy, 10, hx, hy, 260);
    warm.addColorStop(0, 'rgba(255,190,110,.10)');
    warm.addColorStop(0.5, 'rgba(255,150,60,.045)');
    warm.addColorStop(1, 'rgba(255,120,30,0)');
    ctx.fillStyle = warm;
    ctx.fillRect(0, 0, view.w, view.h);
    ctx.restore();

    const rad = Math.max(view.w, view.h) * 0.66;
    const dark = ctx.createRadialGradient(hx, hy, rad * 0.28, hx, hy, rad);
    dark.addColorStop(0, 'rgba(0,0,0,0)');
    dark.addColorStop(0.6, 'rgba(0,0,0,.16)');
    dark.addColorStop(1, 'rgba(0,0,0,.72)');
    ctx.fillStyle = dark;
    ctx.fillRect(0, 0, view.w, view.h);
  }
}

/* ============================================================
   MINIMAP
   ============================================================ */
function drawMinimap() {
  if (!map) return;
  const W = mm.width, H = mm.height;
  mmx.setTransform(1, 0, 0, 1, 0, 0);
  mmx.fillStyle = '#1a1420';
  mmx.fillRect(0, 0, W, H);
  const sx = W / map.W, sy = H / map.H;
  for (let y = 0; y < map.H; y++) {
    for (let x = 0; x < map.W; x++) {
      const t = map.grid[y][x];
      let color = null;
      if (t === T_FLOOR) color = '#3e3629';
      else if (t === T_VOID) color = '#080611';
      else if (t === T_BRIDGE) color = '#9a7434';
      else if (t === T_PLATFORM) color = '#5f5138';
      else if (t === T_STAIRS) color = '#7a643f';
      else if (t === T_TUNNEL) color = '#201a15';
      else if (t === T_GATE) color = '#b07a2a';
      else if (t === T_BOSS_GATE) color = '#a8311e';
      if (color) {
        mmx.fillStyle = color;
        mmx.fillRect(x * sx, y * sy, Math.ceil(sx), Math.ceil(sy));
      }
    }
  }
  // portal
  if (portal) {
    mmx.fillStyle = '#6fe0ff';
    mmx.beginPath();
    mmx.arc(portal.x / TILE * sx, portal.y / TILE * sy, 4, 0, TAU);
    mmx.fill();
  }
  // monsters
  for (const m of monsters) {
    if (m.dead) continue;
    if (m.isBoss) {
      mmx.fillStyle = '#ff8a3a';
      mmx.beginPath();
      mmx.arc(m.x / TILE * sx, m.y / TILE * sy, 4.6, 0, TAU);
      mmx.fill();
      mmx.strokeStyle = 'rgba(255,150,80,.65)';
      mmx.lineWidth = 2;
      mmx.beginPath();
      mmx.arc(m.x / TILE * sx, m.y / TILE * sy, 7.5, 0, TAU);
      mmx.stroke();
    } else {
      mmx.fillStyle = '#e04b4b';
      mmx.beginPath();
      mmx.arc(m.x / TILE * sx, m.y / TILE * sy, 2, 0, TAU);
      mmx.fill();
    }
  }
  // hero
  if (hero) {
    mmx.fillStyle = '#ffd257';
    mmx.beginPath();
    mmx.arc(hero.x / TILE * sx, hero.y / TILE * sy, 3.4, 0, TAU);
    mmx.fill();
    mmx.strokeStyle = 'rgba(255,220,140,.6)';
    mmx.lineWidth = 1.5;
    mmx.beginPath();
    mmx.arc(hero.x / TILE * sx, hero.y / TILE * sy, 6.5, 0, TAU);
    mmx.stroke();
  }
}

/* ============================================================
   UI
   ============================================================ */
let toastTimer = 0;
function toast(text, color) {
  toastEl.textContent = text;
  toastEl.style.color = color || '#e8d6a8';
  toastEl.classList.remove('show');
  void toastEl.offsetWidth;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

function updateHud() {
  if (!hero) return;
  const hpPct = clamp(hero.hp / hero.maxHp, 0, 1);
  const mpPct = clamp(hero.mana / hero.maxMana, 0, 1);
  E.hpLiquid.style.height = (hpPct * 100).toFixed(1) + '%';
  E.mpLiquid.style.height = (mpPct * 100).toFixed(1) + '%';
  E.hpNum.textContent = Math.ceil(Math.max(0, hero.hp));
  E.hpMax.textContent = '/' + hero.maxHp;
  E.mpNum.textContent = Math.floor(Math.max(0, hero.mana));
  E.mpMax.textContent = '/' + hero.maxMana;
  E.hpPot.textContent = hero.potions.hp;
  E.mpPot.textContent = hero.potions.mp;
  E.potHp.classList.toggle('empty', hero.potions.hp <= 0);
  E.potMp.classList.toggle('empty', hero.potions.mp <= 0);
  E.orbHp.classList.toggle('low', hpPct < 0.3);

  E.cdSword.style.height = ((hero.atkCd / hero.atkCdMax) * 100).toFixed(0) + '%';
  E.cdFire.style.height = ((hero.castCd / hero.castCdMax) * 100).toFixed(0) + '%';

  const xpPct = clamp(hero.xp / hero.xpNext, 0, 1) * 100;
  E.xpFill.style.width = xpPct.toFixed(1) + '%';
  E.xpText.textContent = hero.xp + ' / ' + hero.xpNext;
  E.lvlNum.textContent = hero.level;
  E.stats.innerHTML = 'Убито: <b>' + state.kills + '</b> · Золото: <b>' + state.gold + '</b>';

  const alive = monsters.reduce((n, m) => n + (m.dead ? 0 : 1), 0);
  const boss = monsters.find(m => m.isBoss && !m.dead);
  E.bossbar.classList.toggle('on', !!boss);
  if (boss) E.bossFill.style.width = (clamp(boss.hp / boss.maxHp, 0, 1) * 100).toFixed(1) + '%';

  E.depthNum.textContent = state.depth;
  const until = Math.max(0, MAX_DEPTH - state.depth);
  const bossAlive = !!boss;
  const bossDead = !!(arena && arena.boss && arena.boss.dead) || (arena && arena.phase === 'victory');
  let eta;
  if (until > 0) eta = 'До босса: ' + until;
  else if (bossAlive) eta = 'Финал: Диабло';
  else if (bossDead) eta = 'Диабло повержен';
  else eta = 'Финал: Диабло';
  E.bossEta.textContent = eta;
  E.bossEta.classList.toggle('now', until === 0);
  E.miniMeta.textContent = 'УР. ' + state.depth + '/' + MAX_DEPTH + ' · ' + eta;

  let obj = '';
  if (map && map.isArena && arena) {
    const a = arena;
    if (!a.triggered) {
      obj = alive > 0 ? 'Прислужники Диабло: <b>' + alive + '</b>' : 'Войдите в арену';
    } else if (a.phase === 'seal') obj = 'Двери заперты...';
    else if (a.phase === 'dim') obj = 'Свет гаснет...';
    else if (a.phase === 'open') obj = 'Стены дрожат...';
    else if (a.phase === 'emerge') obj = 'Диабло пробудился';
    else if (a.phase === 'fight') obj = 'Убейте Диабло';
    else obj = 'Диабло повержен';
  } else if (portal) {
    obj = 'Портал открыт — <b>войдите в него</b>';
  } else {
    obj = 'Осталось врагов: <b>' + alive + '</b>';
  }
  objectiveEl.innerHTML = obj;
  dmgFlashEl.style.opacity = flash.toFixed(2);
}

/* ============================================================
   OVERLAYS / GAME FLOW
   ============================================================ */
function showOverlay(html) {
  overlay.innerHTML = html;
  overlay.classList.add('on');
}
function hideOverlay() {
  overlay.classList.remove('on');
  overlay.innerHTML = '';
}

function titleScreen() {
  showOverlay(`
    <div class="ov-inner">
      <h1 class="ov-title">ДИАБЛО</h1>
      <div class="ov-sub">превью: три уровня</div>
      <div class="ov-controls">
        <span><b>W A S D</b> движение</span>
        <span><b>ЛКМ / Пробел</b> удар мечом</span>
        <span><b>ПКМ / E</b> огненный шар</span>
        <span><b>1</b> флакон жизни</span>
        <span><b>2</b> флакон маны</span>
      </div>
      <button class="btn" data-act="start" type="button">Войти в подземелье</button>
      <div class="ov-tip">Три уровня, в конце — арена Диабло. Уходите из красного сектора и с линии огня, используйте мост, тоннель и ступени, чтобы оторваться. Флаконы выпадают с врагов.</div>
    </div>
  `);
}

function gameOver() {
  state.mode = 'dead';
  hero.hp = 0;
  shake = 16;
  sfx('death');
  addBloodDecal(hero.x, hero.y, 1.3);
  burst(hero.x, hero.y - 30, 26, { color: '#9c1024', min: 30, max: 190, lifeMin: 0.3, lifeMax: 0.9, sizeMin: 2, sizeMax: 5, g: 300 });
  setTimeout(() => {
    if (state.mode !== 'dead') return;
    showOverlay(`
      <div class="ov-inner">
        <h1 class="ov-title dead">ВЫ ПОГИБЛИ</h1>
        <div class="ov-sub">тьма забрала героя</div>
        <div class="ov-stats">
          <div>Уровень<b>${state.depth}</b></div>
          <div>Убито<b>${state.kills}</b></div>
          <div>Золото<b>${state.gold}</b></div>
          <div>Уровень<b>${hero.level}</b></div>
        </div>
        <button class="btn" data-act="restart" type="button">Попробовать снова</button>
        <div class="ov-tip">или нажмите Enter / R</div>
      </div>
    `);
  }, 750);
}

function startGame() {
  initAudio();
  sfx('click');
  hero = makeHero();
  state.mode = 'playing';
  state.kills = 0;
  state.gold = 0;
  state.depth = 1;
  setCinematic(false);
  hideCineText();
  hideOverlay();
  buildLevel(1);
  updateHud();
  toast('Уровень 1 из 3 — зачистите подземелье', '#e8d6a8');
}

overlay.addEventListener('click', e => {
  const b = e.target.closest('button[data-act]');
  if (!b) return;
  initAudio();
  if (b.dataset.act === 'start' || b.dataset.act === 'restart') startGame();
});

/* ============================================================
   INPUT
   ============================================================ */
function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  mouse.sx = e.clientX - r.left;
  mouse.sy = e.clientY - r.top;
  mouse.has = true;
}

canvas.addEventListener('mousemove', canvasPoint);
canvas.addEventListener('mousedown', e => {
  initAudio();
  canvasPoint(e);
  if (e.button === 0) { mouse.left = true; tryAttack(); }
  if (e.button === 2) { e.preventDefault(); mouse.right = true; tryCast(); }
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) mouse.left = false;
  if (e.button === 2) mouse.right = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mouseleave', () => { mouse.left = false; mouse.right = false; });
document.getElementById('game').addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  const raw = e.key;
  const k = raw.toLowerCase();
  if (k === ' ' || k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright') e.preventDefault();
  if (keys[k]) return;
  keys[k] = true;
  initAudio();
  if (k === '1' || k === '!') usePotion('hp');
  if (k === '2' || k === '@') usePotion('mp');
  if (k === 'e' || k === 'у') tryCast();
  if (k === ' ') tryAttack();
  if (k === 'enter' && state.mode !== 'playing') startGame();
  if (k === 'r' && state.mode === 'dead') startGame();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});
window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  mouse.left = mouse.right = false;
});

E.potHp.addEventListener('click', e => { e.stopPropagation(); initAudio(); usePotion('hp'); });
E.potMp.addEventListener('click', e => { e.stopPropagation(); initAudio(); usePotion('mp'); });
E.slotSword.addEventListener('click', e => { e.stopPropagation(); initAudio(); tryAttack(); });
E.slotFire.addEventListener('click', e => { e.stopPropagation(); initAudio(); tryCast(); });

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
  last = now;
  time += dt;
  shake = Math.max(0, shake - 90 * dt);
  flash = Math.max(0, flash - dt * 2.6);
  darkness = lerp(darkness, darkTarget, 1 - Math.pow(0.25, dt));

  if (state.mode === 'playing') {
    update(dt);
  } else {
    updateParticles(dt);
    updateNumbers(dt);
  }

  render();
  updateHud();
  if (time - lastMM > 0.12) { drawMinimap(); lastMM = time; }
  requestAnimationFrame(loop);
}

/* ============================================================
   DEBUG HOOK (полезно для автотестов в консоли браузера)
   ============================================================ */
window.__diablo = {
  get state() { return state; },
  get hero() { return hero; },
  get monsters() { return monsters; },
  get projectiles() { return projectiles; },
  get map() { return map; },
  get portal() { return portal; },
  get assets() { return assets; },
  get cam() { return cam; },
  get view() { return view; },
  get arena() { return arena; },
  get meteors() { return meteors; },
  get darkness() { return darkness; },
  collides,
  collidesForBoss,
  start: startGame,
  potion: usePotion,
  damage: (m, d) => damageMonster(m, d, 0, 100),
  goto: depth => { if (hero) { buildLevel(depth); updateHud(); } },
};

/* ============================================================
   BOOT
   ============================================================ */
loadAssets().then(() => {
  // idle demo backdrop for the title screen
  hero = null;
  titleScreen();
  requestAnimationFrame(loop);
});
})();
</script>
